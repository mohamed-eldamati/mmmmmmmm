<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#f8f5ee;--bg2:#e9eef7;--card:#fff;--tx:#1f2430;--mut:#7a8194;--ac:#e0463c;--s1:#d6ecff;--s2:#fff3d6;--fl:#dccdab;--sh:0 18px 50px #2a3a6026}

:root[data-theme="dark"]{--bg1:#14151a;--bg2:#1b1e29;--card:#232634;--tx:#eef0f6;--mut:#9aa1b5;--s1:#27425e;--s2:#4b3f25;--fl:#5a4b30;--sh:0 18px 50px #0008}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2));font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
section{height:100svh;box-sizing:border-box;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px 16px}
.hero{text-align:center}.hero h1{font-size:clamp(2.2rem,7vw,4.2rem);margin:0;letter-spacing:-.02em}
.hero p{color:var(--mut);margin:6px 0;font-size:1.05rem}.hero .dn{font-size:2.4rem;color:var(--ac);animation:bob 1.4s infinite}
@keyframes bob{50%{transform:translateY(10px)}}
.no{font-size:.85rem;font-weight:700;color:var(--mut);letter-spacing:.15em}
.stage{width:min(920px,100%,calc((100svh - 250px)*1.6));border-radius:26px;overflow:hidden;box-shadow:var(--sh);background:var(--card)}
.st{aspect-ratio:8/5;background:linear-gradient(var(--s1),var(--s2))}.st svg{width:100%;height:100%;display:block}
.ctl{display:flex;align-items:center;gap:10px;width:min(920px,100%,calc((100svh - 250px)*1.6))}
.b{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font-size:20px;font-weight:700;box-shadow:0 3px 10px #0002;cursor:pointer}
.b.play{background:var(--ac);color:#fff;width:52px;height:52px}.b:active{transform:scale(.93)}
.seg{flex:1;display:flex;gap:6px}.seg i{flex:1;padding:12px 0;cursor:pointer}
.seg u{display:block;height:8px;border-radius:4px;background:linear-gradient(var(--ac),var(--ac)) left/0% 100% no-repeat,#8885}
.seg i.d u{background-size:100% 100%}.seg i.on u{animation:fill 3.2s linear forwards}
@keyframes fill{to{background-size:100% 100%}}
h2{margin:0;text-align:center;font-size:clamp(1.3rem,3.6vw,2.2rem);max-width:900px;line-height:1.25}
.paused *{animation-play-state:paused!important}
#nav{position:fixed;right:10px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:9px;z-index:5}
#nav a{width:10px;height:10px;border-radius:50%;background:#8886;transition:.2s}#nav a.on{background:var(--ac);transform:scale(1.5)}
@media(max-width:560px){#nav{display:none}}
svg *{transform-box:fill-box}
.pop{animation:pop .45s both;transform-origin:center}
.hop{animation:hop .8s infinite}.tw{animation:tw 1s infinite alternate;transform-origin:center}
.L{animation:L .9s both}.R{animation:R .9s both}
.pay{animation:pay 1.4s .3s both}.scan{animation:scan 2s .2s both}
.big{animation:big 1.6s .3s both}.short{animation:short 1.6s .3s both}.strain{animation:strain .7s infinite alternate}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes hop{50%{transform:translateY(-9px)}}
@keyframes tw{from{transform:scale(.6)}to{transform:scale(1.25)}}
@keyframes L{from{transform:translateX(-260px)}}@keyframes R{from{transform:translateX(260px)}}
@keyframes pay{to{transform:translateX(140px)}}@keyframes scan{to{transform:translateX(200px)}}
@keyframes big{to{transform:scale(1.8)}}
@keyframes short{from{transform:scaleY(1.7)}to{transform:scaleY(.5)}}
@keyframes strain{to{transform:scaleX(1.2)}}

const root=document.getElementById('root'),nav=document.getElementById('nav'),sc=[];let cur=0;
nav.innerHTML=S.map((_,i)=>`<a href="#s${i}" title="${i+1}"></a>`).join('');
S.forEach(([t,f],i)=>{
 const sec=document.createElement('section');sec.id='s'+i;
 sec.innerHTML=`<div class="no">${i+1} / ${S.length}</div><div class="stage"><div class="st"></div></div><div class="ctl"><button class="b prev" aria-label="zurück">‹</button><button class="b play" aria-label="Pause">❚❚</button><button class="b next" aria-label="weiter">›</button><div class="seg">${f.map(()=>'<i><u></u></i>').join('')}</div><button class="b rep" aria-label="Neustart">↻</button></div><h2>${t}</h2>`;
 root.appendChild(sec);
 const q=s=>sec.querySelector(s),st=q('.st'),seg=[...sec.querySelectorAll('.seg i')],pb=q('.play');
 const o={k:0,user:false,vis:false};
 o.apply=()=>{sec.classList.toggle('paused',o.user||!o.vis);pb.textContent=o.user?'▶':'❚❚'};
 o.show=n=>{o.k=n;st.innerHTML=`<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMax meet"><rect y="211" width="400" height="39" style="fill:var(--fl)"/>${f[n]}</svg>`;
  seg.forEach(e=>e.className='');void sec.offsetWidth;seg.forEach((e,j)=>e.className=j<n?'d':j==n?'on':'')};
 o.step=d=>o.show((o.k+d+f.length)%f.length);
 q('.seg').addEventListener('animationend',e=>{if(e.animationName=='fill')o.step(1)});
 seg.forEach((e,j)=>e.onclick=()=>o.show(j));
 q('.prev').onclick=()=>o.step(-1);q('.next').onclick=()=>o.step(1);
